<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taky Apartment ERP — UI Prototype</title><style>
:root{font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:#142842;background:#edf4fc}*{box-sizing:border-box}body{margin:0}.app{display:flex;min-height:100vh}.sidebar{width:235px;background:linear-gradient(180deg,#0c2d58,#081a34);color:white;padding:24px 14px;flex-shrink:0}.brand{font-weight:800;font-size:18px;margin:5px 12px 30px}.nav{display:block;width:100%;border:0;background:none;color:#c6d8f2;text-align:left;padding:13px 15px;border-radius:9px;cursor:pointer;font:inherit;margin-bottom:5px}.nav:hover,.nav.active{background:#1460c6;color:white}.main{padding:32px;flex:1;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px}h1{font-size:26px;margin:0 0 5px}h2{font-size:17px;margin:0 0 18px}p{margin:0;color:#6a7e97}.pill{font-size:12px;padding:5px 9px;border-radius:20px;background:#d9f7e9;color:#087a4c}.danger{background:#ffe1e2;color:#c83a41}.muted{background:#e9eff6;color:#52657d}.warn{background:#fff1cd;color:#9a6400}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:#fff;border-radius:13px;box-shadow:0 3px 15px #234b7510;padding:21px;margin-bottom:18px}.metric{font-size:28px;font-weight:800;margin-top:12px}.green{color:#079a70}.blue{color:#126ce0}.red{color:#d84242}.purple{color:#7656db}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.roomgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.room{border:1px solid #e4ebf4;background:#f8fbff;border-radius:11px;padding:16px;cursor:pointer;text-align:left}.room strong{display:block;font-size:20px;margin-bottom:12px}.room small{display:block;margin-top:10px;color:#73869c}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.btn{background:#126ce0;border:0;color:#fff;padding:11px 16px;border-radius:9px;cursor:pointer;font-weight:700}.secondary{background:#e9f2ff;color:#1559a8}input,select{padding:11px;border:1px solid #d8e3ef;border-radius:8px;background:white;max-width:100%}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:14px;border-bottom:1px solid #edf1f6}th{color:#71849a;background:#f7faff;font-weight:600}.bars{display:flex;align-items:end;gap:14px;height:190px;padding:15px 0}.bar{flex:1;border-radius:5px 5px 0 0;background:#18b78a;min-height:8px}.empty{padding:50px;text-align:center;color:#7d8da3}.hide{display:none}.footer{font-size:12px;color:#8291a5;margin-top:22px}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.roomgrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.app{display:block}.sidebar{width:auto;padding:12px;display:flex;overflow:auto;align-items:center;gap:4px}.brand{white-space:nowrap;margin:0 12px}.nav{width:auto;white-space:nowrap;margin:0}.main{padding:18px}.two{grid-template-columns:1fr}.roomgrid{grid-template-columns:repeat(2,1fr)}.grid{gap:10px}.card{padding:14px}.metric{font-size:22px}table{display:block;overflow:auto}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">⌂ Taky Apartment ERP</div><div id="nav"></div></aside><main class="main"><div class="top"><div><h1 id="title">ภาพรวม</h1><p>ระบบบริหารหอพัก • 15 ห้อง / 3 ชั้น</p></div><span class="pill">● UI Demo • Local-first</span></div><div id="content"></div><div class="footer">Prototype only — sample data is fictional and not persisted. Do not use for real financial records.</div></main></div><script>
const pages=[["dashboard","⌂ ภาพรวม"],["rooms","▦ ห้องพัก"],["tenants","♙ ผู้เช่า"],["leases","▤ สัญญาเช่า"],["billing","▣ ออกบิลและค่าน้ำไฟ"],["payments","◈ การชำระเงิน"],["expenses","◉ ค่าใช้จ่าย OPEX/CAPEX"],["reports","▥ รายงานการเงิน"],["maintenance","⚒ แจ้งซ่อม"],["settings","⚙ ตั้งค่าและสำรองข้อมูล"]];
const rooms=Array.from({length:15},(_,i)=>({number:(Math.floor(i/5)+1)*100+(i%5)+1,occupied:![2,8,13].includes(i),due:[1,7].includes(i),rent:3500}));
const money=n=>"฿ "+n.toLocaleString("th-TH");const pill=(s,k="")=>'<span class="pill '+k+'">'+s+'</span>';const card=(title,body)=>'<section class="card"><h2>'+title+'</h2>'+body+'</section>';const metric=(label,value,color)=>'<div class="card"><p>'+label+'</p><div class="metric '+color+'">'+value+'</div></div>';
const table=(headers,rows)=>'<table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
const demoPayments=[["05/10/2026","101","ผู้เช่าตัวอย่าง A",money(4600),"โอนเงิน",pill("ยืนยันแล้ว")],["05/10/2026","201","ผู้เช่าตัวอย่าง B",money(3500),"เงินสด",pill("ยืนยันแล้ว")],["04/10/2026","202","ผู้เช่าตัวอย่าง C",money(3500),"QR Code",pill("รอตรวจสอบ","warn")]];
const demoExpenses=[["05/10/2026","ค่าไฟส่วนกลาง","สาธารณูปโภค",pill("OPEX"),money(2500)],["03/10/2026","ค่าทำความสะอาด","บริการ",pill("OPEX"),money(800)],["01/10/2026","อินเทอร์เน็ต","บริการ",pill("OPEX"),money(900)],["29/09/2026","ซ่อมก๊อกน้ำ","ซ่อมบำรุง",pill("OPEX"),money(1500)],["15/09/2026","ซื้อแอร์ใหม่ ห้อง 304","ครุภัณฑ์",pill("CAPEX","warn"),money(18000)]];
function render(id){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.id===id));document.getElementById('title').textContent=pages.find(p=>p[0]===id)[1].replace(/^[^ ]+ /,'');let out='';
if(id==='dashboard'){out='<div class="grid">'+metric("รายรับตามบิล",money(52500),"green")+metric("รับชำระแล้ว",money(48000),"blue")+metric("ค้างชำระ",money(4500),"red")+metric("ค่าใช้จ่ายดำเนินงาน",money(12300),"purple")+'</div><div class="two">'+card("อัตราการเข้าพัก",'<div class="metric green">12 / 15 ห้อง</div><p>80% Occupancy</p><div style="background:#e8eef6;height:12px;border-radius:9px;margin-top:20px"><div style="background:#13a879;width:80%;height:12px;border-radius:9px"></div></div>')+card("รายรับ 6 เดือน (ข้อมูลตัวอย่าง)",'<div class="bars">'+[50,65,59,72,80,74].map(v=>'<div class="bar" style="height:'+v+'%"></div>').join('')+'</div>')+'</div>'+card("รายการที่ต้องดำเนินการ",table(["รายการ","สถานะ"],[["ห้อง 102 ค้างชำระ",pill("ค้างชำระ","danger")],["ห้อง 203 แจ้งซ่อม",pill("กำลังดำเนินการ","warn")]]));}
if(id==='rooms'){out=card("สถานะห้องพัก",'<div class="toolbar"><select id="floor"><option value="all">ทุกชั้น</option><option value="1">ชั้น 1</option><option value="2">ชั้น 2</option><option value="3">ชั้น 3</option></select><button class="btn secondary" id="reset">แสดงทั้งหมด</button></div><div class="roomgrid" id="roomgrid"></div>');}
if(id==='tenants'){out=card("ข้อมูลผู้เช่า",table(["ห้อง","ชื่อ","ค่าเช่า","สถานะ"],rooms.filter(r=>r.occupied).map((r,i)=>[r.number,"ผู้เช่าตัวอย่าง "+(i+1),money(r.rent),pill("มีผู้เช่า")])));}
if(id==='leases'){out=card("สัญญาเช่า",table(["ห้อง","วันเริ่ม","วันสิ้นสุด","เงินประกัน","สถานะ"],rooms.filter(r=>r.occupied).slice(0,8).map(r=>[r.number,"01/01/2026","31/12/2026",money(7000),pill("ใช้งาน")])));}
if(id==='billing'){out=card("ตัวอย่างคำนวณบิลรายเดือน",'<div class="toolbar"><label>มิเตอร์น้ำก่อน <input id="waterOld" type="number" value="120"></label><label>มิเตอร์น้ำปัจจุบัน <input id="waterNew" type="number" value="130"></label><label>มิเตอร์ไฟก่อน <input id="elecOld" type="number" value="1250"></label><label>มิเตอร์ไฟปัจจุบัน <input id="elecNew" type="number" value="1350"></label></div><div id="billcalc"></div><button class="btn" id="recalc">คำนวณตัวอย่าง</button><p style="margin-top:12px">ตัวเลขอัตราค่าน้ำและไฟเป็นเพียงตัวอย่าง ต้องกำหนดตามเงื่อนไขจริง</p>');}
if(id==='payments'){out=card("บันทึกการชำระเงิน",'<div class="toolbar"><button class="btn" id="addPayment">+ บันทึกการชำระเงิน (Demo)</button></div>'+table(["วันที่","ห้อง","ผู้เช่า","ยอดชำระ","วิธีชำระ","สถานะ"],demoPayments));}
if(id==='expenses'){out=card("บันทึกค่าใช้จ่าย",'<div class="toolbar"><select id="expenseFilter"><option value="all">ทั้งหมด</option><option value="OPEX">OPEX</option><option value="CAPEX">CAPEX</option></select><button class="btn" id="addExpense">+ เพิ่มค่าใช้จ่าย (Demo)</button></div><div id="expenseTable"></div>');}
if(id==='reports'){out='<div class="grid">'+metric("รับชำระ",money(48000),"green")+metric("OPEX",money(6700),"red")+metric("CAPEX",money(18000),"purple")+metric("กระแสเงินสดสุทธิ",money(23300),"blue")+'</div>'+card("สรุปรายรับและค่าใช้จ่าย",table(["ประเภท","จำนวน"],[["เงินรับจริง",money(48000)],["OPEX",money(6700)],["CAPEX",money(18000)],["Cash Flow (ตัวอย่าง)",money(23300)]]));}
if(id==='maintenance'){out=card("รายการแจ้งซ่อม",table(["วันที่","ห้อง","รายละเอียด","ความสำคัญ","สถานะ"],[["05/10/2026","203","แอร์ไม่เย็น",pill("สูง","danger"),pill("กำลังดำเนินการ","warn")],["02/10/2026","204","ท่อน้ำรั่ว",pill("สูง","danger"),pill("รออนุมัติ","warn")],["28/09/2026","101","หลอดไฟเสีย",pill("ปานกลาง","warn"),pill("เสร็จสิ้น")]]));}
if(id==='settings'){out=card("การสำรองข้อมูล",'<p>เป้าหมายระบบจริง: สำรองข้อมูลแบบเข้ารหัสทุกสัปดาห์ไป Google Drive พร้อมทดสอบ Restore</p><div style="margin-top:20px">'+pill("ยังไม่ได้เชื่อมต่อ Google Drive","warn")+'</div><p style="margin-top:16px">หน้า Prototype นี้ยังไม่มี Backup หรือ Restore จริง</p>');}
document.getElementById('content').innerHTML=out;
if(id==='rooms'){const draw=()=>{const floor=document.getElementById('floor').value;document.getElementById('roomgrid').innerHTML=rooms.filter(r=>floor==='all'||String(Math.floor(r.number/100))===floor).map(r=>'<button class="room" data-room="'+r.number+'"><strong>'+r.number+'</strong>'+pill(r.due?'ค้างชำระ':r.occupied?'มีผู้เช่า':'ว่าง',r.due?'danger':r.occupied?'':'muted')+'<small>'+money(r.rent)+'/เดือน</small></button>').join('');document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>alert('ห้อง '+b.dataset.room+' — ข้อมูลตัวอย่าง'));};document.getElementById('floor').onchange=draw;document.getElementById('reset').onclick=()=>{document.getElementById('floor').value='all';draw()};draw();}
if(id==='billing'){const calc=()=>{const v=x=>Number(document.getElementById(x).value);const w=v('waterNew')-v('waterOld'),e=v('elecNew')-v('elecOld');document.getElementById('billcalc').innerHTML=w<0||e<0?'<p class="red">มิเตอร์ปัจจุบันต้องไม่ต่ำกว่าครั้งก่อน</p>':table(["รายการ","จำนวน"],[["ค่าเช่า",money(3500)],["ค่าน้ำ "+w+" หน่วย × ฿20",money(w*20)],["ค่าไฟ "+e+" หน่วย × ฿8",money(e*8)],["รวม",'<strong>'+money(3500+w*20+e*8)+'</strong>']]);};document.getElementById('recalc').onclick=calc;calc();}
if(id==='expenses'){const draw=()=>{let f=document.getElementById('expenseFilter').value;document.getElementById('expenseTable').innerHTML=table(["วันที่","รายการ","หมวดหมู่","ประเภท","จำนวน"],demoExpenses.filter(r=>f==='all'||r[3].includes(f)));};document.getElementById('expenseFilter').onchange=draw;draw();document.getElementById('addExpense').onclick=()=>alert('UI demo only — การบันทึกจริงจะพัฒนาใน P0');}
if(id==='payments')document.getElementById('addPayment').onclick=()=>alert('UI demo only — การบันทึกจริงจะพัฒนาใน P0');
}
document.getElementById('nav').innerHTML=pages.map(([id,label])=>'<button class="nav" data-id="'+id+'">'+label+'</button>').join('');document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>render(n.dataset.id));render('dashboard');
</script></body></html>
