# Isolated Debian Trixie candidate for collation and restore validation.
# Never reuse the operational project or database volume for candidate checks.
name: taky-erp-trixie-collation-candidate
services:
  db:
    image: taky-erp-postgres:17.11-trixie-collation-candidate-gosu-1.19-user-0.4.1-xsys-0.44.0
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      args:
        POSTGRES_BASE_IMAGE: postgres:17.11-trixie@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Generate .env first}
      POSTGRES_USER: ${POSTGRES_USER:?Generate .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [private]
networks:
  private:
    driver: bridge
volumes:
  database:
    name: taky-erp-trixie-collation-candidate-database
