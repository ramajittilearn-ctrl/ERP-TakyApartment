# Isolated image candidate for CI and synthetic restore validation.
# Keep this project and volume separate from the operational taky-erp stack.
name: taky-erp-alpine-candidate
services:
  db:
    image: taky-erp-postgres:17.11-alpine3.24-gosu-1.19-user-0.4.1-xsys-0.44.0
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      args:
        POSTGRES_BASE_IMAGE: postgres:17.11-alpine3.24@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Generate .env first}
      POSTGRES_USER: ${POSTGRES_USER:?Generate .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [private]
networks:
  private:
    driver: bridge
volumes:
  database:
    name: taky-erp-alpine-candidate-database
