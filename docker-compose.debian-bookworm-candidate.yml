# Isolated Debian Bookworm candidate for collation and restore validation.
# Never reuse the operational project or database volume for candidate checks.
name: taky-erp-bookworm-collation-candidate
services:
  db:
    image: taky-erp-postgres:17.11-bookworm-security-candidate-20261027-openssl-tzdata-gosu-1.19-user-0.4.1-xsys-0.44.0
    build:
      context: .
      dockerfile: docker/postgres/bookworm-security-candidate.Dockerfile
      args:
        POSTGRES_BASE_IMAGE: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        DEBIAN_MAIN_SNAPSHOT: 20261027T000000Z
        DEBIAN_SECURITY_SNAPSHOT: 20261027T000000Z
        OPENSSL_PACKAGE_VERSION: 3.0.22-1~deb12u2
        LIBSSL3_PACKAGE_VERSION: 3.0.22-1~deb12u2
        TZDATA_PACKAGE_VERSION: 2026e-0+deb12u1
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Generate .env first}
      POSTGRES_USER: ${POSTGRES_USER:?Generate .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [private]
networks:
  private:
    driver: bridge
volumes:
  database:
    name: taky-erp-bookworm-collation-candidate-database
