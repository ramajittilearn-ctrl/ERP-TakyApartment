services:
  restore-db:
    image: postgres:17.11-alpine3.24@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: taky_restore_test
      POSTGRES_USER: taky
      POSTGRES_PASSWORD: ${RESTORE_PASSWORD:?Set isolated restore password}
    volumes: [restore_database:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taky -d taky_restore_test"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [restore]
  restore:
    image: taky-operations:local
    environment:
      PGHOST: restore-db
      PGDATABASE: taky_restore_test
      PGUSER: taky
      PGPASSWORD: ${RESTORE_PASSWORD:?Set isolated restore password}
      RESTORE_MODE: isolated
      BACKUP_DIR: /backups
      BACKUP_KEY_FILE: /run/secrets/backup.key
    volumes:
      - ${BACKUP_DIR:?Set local backup directory}:/backups
      - ${BACKUP_KEY_PATH:?Set private encryption key path}:/run/secrets/backup.key:ro
      - restore_attachments:/restore-attachments
    depends_on:
      restore-db:
        condition: service_healthy
    networks: [restore]
networks:
  restore:
    internal: true
volumes:
  restore_database:
  restore_attachments:
