name: Phase 4 CI

on:
  pull_request:
    branches:
      - release/phase4
  push:
    branches:
      - release/phase4
      - codex/phase4-production-prep

permissions:
  contents: read

concurrency:
  group: phase4-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  required-quality:
    name: required-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run operations tests
        run: npm run test:ops

      - name: Lint
        run: npm run lint

      - name: Build application
        run: npm run build

  container-verification:
    name: container-verification
    runs-on: ubuntu-24.04
    needs: required-quality
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build pinned images and verify isolated runtime
        run: bash scripts/ci/verify-container-images.sh
