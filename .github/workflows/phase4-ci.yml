name: Phase 4 CI

on:
  pull_request:
    branches:
      - release/phase4
  push:
    branches:
      - release/phase4
      - codex/phase4-production-prep
      - codex/phase4-current-source-20261026

permissions:
  contents: read

concurrency:
  group: phase4-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  required-quality:
    name: required-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run operations tests
        run: npm run test:ops

      - name: Lint
        run: npm run lint

      - name: Build application
        run: npm run build

  container-verification:
    name: container-verification
    runs-on: ubuntu-24.04
    needs: required-quality
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go for exact gosu binary vulnerability analysis
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          check-latest: false

      - name: Install pinned govulncheck
        env:
          GOBIN: ${{ runner.temp }}/taky-gosu-tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Build pinned images and verify isolated runtime
        run: bash scripts/ci/verify-container-images.sh

      - name: Upload current-image vulnerability reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-vulnerability-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase4-container-scan/
          if-no-files-found: warn
          retention-days: 30

  stage5-runtime-verification:
    name: stage5-runtime-verification
    runs-on: ubuntu-24.04
    needs: required-quality
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies and Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/stage5-playwright-browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libnss3-tools qpdf poppler-utils tesseract-ocr tesseract-ocr-tha

      - name: Run exact-source billing, payment, receipt, and Thai PDF verification
        env:
          STAGE5_ARTIFACT_ROOT: ${{ runner.temp }}/stage5-runtime
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/stage5-playwright-browsers
        run: node scripts/verify-stage5-runtime.mjs

      - name: Upload source-bound Stage 5 runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage5-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage5-runtime/
          if-no-files-found: warn
          retention-days: 30

  agent-uat:
    name: agent-uat
    runs-on: ubuntu-24.04
    needs: container-verification
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Install isolated Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Build source for browser Agent UAT
        run: npm run build

      - name: Run isolated synthetic browser Agent UAT
        id: agent-uat-run
        shell: bash
        run: |
          set +e
          node scripts/run-remediation-browser.mjs 2>&1 | tee "$RUNNER_TEMP/agent-uat.log"
          pipeline_status=("${PIPESTATUS[@]}")
          uat_status=${pipeline_status[0]}
          tee_status=${pipeline_status[1]}
          if [[ "$uat_status" == 0 && "$tee_status" != 0 ]]; then uat_status=$tee_status; fi
          run_id="$(sed -nE 's/.*"runId":"([a-f0-9]{24})".*/\1/p' "$RUNNER_TEMP/agent-uat.log" | tail -n 1)"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          exit "$uat_status"

      - name: Record source-bound Agent UAT report
        if: always()
        env:
          AGENT_UAT_RUN_ID: ${{ steps.agent-uat-run.outputs.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, readFile, writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          import { join } from 'node:path';

          const runId = process.env.AGENT_UAT_RUN_ID;
          const sourceCommit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const dir = runId && /^[a-f0-9]{24}$/.test(runId)
            ? join('evidence/remediation', `browser-${runId}`)
            : undefined;
          let execution;
          let stats;
          if (dir) {
            try {
              execution = JSON.parse(await readFile(join(dir, 'execution.json'), 'utf8'));
              stats = JSON.parse(await readFile(join(dir, 'results.json'), 'utf8')).stats;
            } catch {}
          }
          let lines = [
            '# Agent UAT',
            '',
            `- Checkout commit: \`${sourceCommit}\``,
            `- PR head commit: \`${process.env.PR_HEAD_SHA}\``,
            '- Mode: synthetic browser UAT on an isolated Ubuntu runner; no Owner UAT or production data.',
            '- Runtime scope: source-built standalone app; pinned container images are covered by the separate container-verification job.',
          ];
          let reportPass = false;
          if (execution && stats && execution.runId === runId) {
            const passed = stats.expected;
            const minimumExpected = 89;
            const validStats = ['expected', 'unexpected', 'skipped', 'flaky']
              .every((key) => Number.isSafeInteger(stats[key]) && stats[key] >= 0);
            const result = execution.succeeded === true && execution.browserStarted === true && validStats && passed >= minimumExpected && stats.unexpected === 0 && stats.skipped === 0 && stats.flaky === 0 ? 'PASS' : 'FAIL';
            reportPass = result === 'PASS';
            lines.push(
              `- Result: ${result}`,
              `- Passed: ${passed} (minimum required: ${minimumExpected}); failed: ${stats.unexpected}; skipped: ${stats.skipped}; flaky: ${stats.flaky}`,
              `- Run: \`${runId}\``,
            );
          } else {
            lines.push('- Result: INCOMPLETE; no unambiguous run report was produced. Inspect the UAT step logs.');
          }
          const report = `${lines.join('\n')}\n`;
          await appendFile(process.env.GITHUB_STEP_SUMMARY, report);
          if (dir) await writeFile(join(dir, 'agent-uat-report.md'), report);
          if (!reportPass) process.exitCode = 1;
          NODE

      - name: Upload sanitized Agent UAT report
        if: always() && steps.agent-uat-run.outputs.run_id != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-uat-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/remediation/browser-${{ steps.agent-uat-run.outputs.run_id }}/agent-uat-report.md
            evidence/remediation/browser-${{ steps.agent-uat-run.outputs.run_id }}/results.json
            evidence/remediation/browser-${{ steps.agent-uat-run.outputs.run_id }}/execution.json
          if-no-files-found: warn
          retention-days: 30
